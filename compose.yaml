services:

  frontend:
    build:
      context: ./frontend
      target: ${APP_MODE:-dev}
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      - type: volume
        source: tokenscope_frontend_node_modules
        target: /app/node_modules
      - type: volume
        source: ${CADDY_DATA_VOLUME:-tokenscope_dev_scratch}
        target: /data
      - type: volume
        source: tokenscope_caddy_config
        target: /config
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_HOST_PORT:-${FRONTEND_PORT}}:${FRONTEND_CONTAINER_PORT:-5173}"
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:${BACKEND_PORT}"
      BACKEND_PORT: "${BACKEND_PORT}"
  backend:
    build:
      context: ./backend
      target: ${APP_MODE:-dev}
    volumes:
      - type: bind
        source: ./backend
        target: /app/
      - type: volume
        source: tokenscope_backend_node_modules
        target: /app/node_modules
    expose:
      - "${BACKEND_PORT}"
    environment:
      BACKEND_PORT: "${BACKEND_PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS}"
    depends_on:
     postgres:
      condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:'+process.env.BACKEND_PORT+'/api/v1/health/db',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    volumes:
      - type: volume
        source: tokenscope_postgres_data
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
     test:
      [
       "CMD-SHELL",
       "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
     interval: 5s
     timeout: 5s
     retries: 5

volumes:
  tokenscope_frontend_node_modules:
  tokenscope_backend_node_modules:
  tokenscope_postgres_data:
  tokenscope_dev_scratch:
  tokenscope_caddy_data:
  tokenscope_caddy_config:
