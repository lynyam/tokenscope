services:

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      - type: volume
        source: tokenscope_frontend_node_modules
        target: /app/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:${BACKEND_PORT}"
    command:
      - sh
      - -c
      - "npm ci && npm run dev"
  backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - type: bind
        source: ./backend
        target: /app/
      - type: volume
        source: tokenscope_backend_node_modules
        target: /app/node_modules
    expose:
      - "${BACKEND_PORT}"
    environment:
      BACKEND_PORT: "${BACKEND_PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS}"
    depends_on:
     postgres:
      condition: service_healthy
    command:
      - sh
      - -c
      - "npm ci && npm run dev"

  postgres:
    image: postgres:16-alpine
    volumes:
      - type: volume
        source: tokenscope_postgres_data
        target: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
     test:
      [
       "CMD-SHELL",
       "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
     interval: 5s
     timeout: 5s
     retries: 5
migrate:
  profiles: [eval]
  build: { context: ./backend, dockerfile: Dockerfile, target: build }
  command: ["npx", "prisma", "migrate", "deploy"]
  environment:
    DATABASE_URL: "${DATABASE_URL}"
  depends_on:
    postgres: { condition: service_healthy }
  restart: "no"

backend-eval:
  profiles: [eval]
  build: { context: ./backend, dockerfile: Dockerfile, target: production }
  environment:
    BACKEND_PORT: "${BACKEND_PORT}"
    DATABASE_URL: "${DATABASE_URL}"
    JWT_SECRET: "${JWT_SECRET}"
    JWT_ISSUER: "${JWT_ISSUER}"
    JWT_AUDIENCE: "${JWT_AUDIENCE}"
    JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS}"
    APP_ORIGIN: "${APP_ORIGIN}"
    LLM_PROVIDER_API_KEY: "${LLM_PROVIDER_API_KEY:-}"
  volumes:
    - tokenscope_eval_private_files:/app/private-files
  expose:
    - "${BACKEND_PORT}"
  depends_on:
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:'+process.env.BACKEND_PORT+'/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
    interval: 5s
    timeout: 5s
    retries: 15
    start_period: 10s

frontend-build:
  profiles: [eval]
  build:
    context: ./frontend
    dockerfile: Dockerfile
    target: build
    args: { VITE_API_BASE: /api/v1 }
  volumes:
    - tokenscope_eval_frontend_dist:/output
  command: ["sh", "-c", "cp -r /app/dist/. /output/ && echo 'frontend build copied'"]
  restart: "no"

caddy:
  profiles: [eval]
  image: caddy:2-alpine
  volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - tokenscope_eval_frontend_dist:/srv/frontend:ro
    - tokenscope_eval_caddy_data:/data
    - tokenscope_eval_caddy_config:/config
  ports:
    - "${EVAL_HTTPS_PORT:-8443}:8443"
  depends_on:
    backend-eval: { condition: service_healthy }
    frontend-build: { condition: service_completed_successfully }
volumes:
  tokenscope_frontend_node_modules:
  tokenscope_backend_node_modules:
  tokenscope_postgres_data:
  tokenscope_eval_private_files:
  tokenscope_eval_frontend_dist:
  tokenscope_eval_caddy_data:
  tokenscope_eval_caddy_config:
